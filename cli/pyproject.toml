[project]
name = "irudd-voice"
version = "0.1.0"
description = "Command-line tools for irudd-voice: stats now; labeling, datasets and training later."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
irudd-voice = "irudd_voice.cli:main"

[dependency-groups]
dev = ["pytest>=8", "soundfile>=0.13", "numpy>=2"]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
