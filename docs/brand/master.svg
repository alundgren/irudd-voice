        <path d="M 580,352 L 748,512 L 580,672" fill="none" stroke="#08264e" stroke-width="88" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="voice-to-prompt" fill="url(#ink)"><rect x="236" y="424" width="88" height="176" rx="44"/>
        <rect x="388" y="312" width="88" height="400" rx="44"/>
        <path d="M 580,352 L 748,512 L 580,672" fill="none" stroke="url(#ink)" stroke-width="88" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="insertion-line"><rect x="620" y="742" width="168" height="52" rx="26" fill="url(#mint)"/></g>
