<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">irudd-voice app icon</title>
  <desc id="desc">Two sound bars resolve into a prompt chevron above a green insertion line, on a blue rounded square.</desc>
  <defs>
    <linearGradient id="tile" x1=".15" y1="0" x2=".85" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#147ee0"/><stop offset=".50" stop-color="#1556a3"/><stop offset="1" stop-color="#163462"/>
    </linearGradient>
    <radialGradient id="bloom" cx=".18" cy=".08" r=".92">
      <stop stop-color="#56beff" stop-opacity=".36"/><stop offset=".70" stop-color="#0a84ff" stop-opacity=".06"/><stop offset="1" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2=".35" y2="1">
      <stop stop-color="#c3e9ff" stop-opacity=".70"/><stop offset=".48" stop-color="#a3d8ff" stop-opacity=".14"/><stop offset="1" stop-color="#3e7eb8" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f5fbff"/><stop offset="1" stop-color="#dceeff"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8bffd0"/><stop offset="1" stop-color="#30d158"/>
    </linearGradient>
  </defs>
  <g id="background">
    
      <path d="M 304,64 H 720 C 886,64 960,138 960,304 V 720 C 960,886 886,960 720,960 H 304 C 138,960 64,886 64,720 V 304 C 64,138 138,64 304,64 Z" fill="#061c40" opacity=".22" transform="translate(0 12)"/>
    
    <path d="M 304,64 H 720 C 886,64 960,138 960,304 V 720 C 960,886 886,960 720,960 H 304 C 138,960 64,886 64,720 V 304 C 64,138 138,64 304,64 Z" fill="url(#tile)"/>
    <path d="M 304,64 H 720 C 886,64 960,138 960,304 V 720 C 960,886 886,960 720,960 H 304 C 138,960 64,886 64,720 V 304 C 64,138 138,64 304,64 Z" fill="url(#bloom)"/>
    
      <path d="M 304,64 H 720 C 886,64 960,138 960,304 V 720 C 960,886 886,960 720,960 H 304 C 138,960 64,886 64,720 V 304 C 64,138 138,64 304,64 Z" fill="none" stroke="url(#rim)" stroke-width="4"/>
      <path d="M 186,168 C 222,130 270,116 334,116 H 690" fill="none" stroke="#d8f0ff" stroke-opacity=".16" stroke-width="5" stroke-linecap="round"/>
    
